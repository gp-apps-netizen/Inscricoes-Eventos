<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inscrição</title>
<meta name="theme-color" content="#4338ca">
<link rel="icon" id="favIcon">
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#1c1d29;--muted:#6b6f85;--line:#e3e5ee;--pri:#4338ca;--pri2:#eef0ff;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2}
@media (prefers-color-scheme:dark){:root{--bg:#12131a;--card:#1c1d27;--text:#eceef6;--muted:#9a9db3;--line:#2d2f3d;--pri:#818cf8;--pri2:#262a4a;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
.top{background:#4338ca;color:#fff;padding:26px 16px 60px;padding-top:calc(26px + env(safe-area-inset-top))}
@media (prefers-color-scheme:dark){.top{background:#2b2f6b}}
.top .in{max-width:560px;margin:0 auto}
.top small{opacity:.85;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.top h1{margin:6px 0 8px;font-size:24px;line-height:1.2}
.top .meta{opacity:.92;font-size:15px}
main{max-width:560px;margin:-40px auto 0;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(20,20,60,.06)}
.desc{white-space:pre-wrap;font-size:15px;color:var(--muted);margin:0 0 6px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card);color:var(--text);font-family:inherit}
textarea{min-height:80px;resize:vertical}
input.err,select.err,textarea.err{border-color:var(--bad)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:13px;font-size:16px;cursor:pointer;margin-top:10px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.btn.pri{color:#12131a}}
.btn:disabled{opacity:.6}
.muted{color:var(--muted);font-size:14px}
.msg{padding:12px;border-radius:10px;font-size:15px;margin-top:12px}
.msg.bad{background:var(--badbg);color:var(--bad)}
.msg.ok{background:var(--okbg);color:var(--ok)}
.voucher{text-align:center}
.voucher .nome{font-size:22px;font-weight:700;margin:4px 0}
.qrbox{display:inline-block;padding:12px;background:#fff;border-radius:12px;margin:12px 0 4px;border:1px solid #e3e5ee}
.codigo{font-size:26px;font-weight:800;letter-spacing:.2em;color:var(--pri)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.item{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none}
.item:last-child{border-bottom:0}
.center{text-align:center}
.hidden{display:none!important}
.spin{width:32px;height:32px;border:3px solid var(--pri2);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
.priv{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.4}
.banner{display:block;width:calc(100% + 36px);margin:-18px -18px 16px;max-height:260px;object-fit:cover;border-radius:15px 15px 0 0}
.preco{display:flex;justify-content:space-between;align-items:center;background:var(--pri2);color:var(--pri);border-radius:10px;padding:10px 12px;margin:10px 0 4px;font-size:15px}
.preco b{font-size:18px}
.pix h3{margin:0 0 4px;font-size:18px}
.pix .valor{font-size:28px;font-weight:800;margin:4px 0}
.copia{width:100%;min-height:74px;font-family:ui-monospace,monospace;font-size:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);resize:none;word-break:break-all}
.st{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700}
.st.pend{background:#fef3c7;color:#92400e}
.st.ok{background:var(--okbg);color:var(--ok)}
.kvp{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);text-align:left}
.kvp span{color:var(--muted)}
.kvp b{word-break:break-all;text-align:right}
</style>
</head>
<body>

<div class="top"><div class="in">
  <small id="topSmall">Inscrição</small>
  <h1 id="topTitulo">Carregando…</h1>
  <div class="meta" id="topMeta"></div>
</div></div>
<main id="conteudo"><div class="card"><div class="spin"></div></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
/* ================== Utilidades ================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtData(e){if(!e||!e.data)return '';const[a,m,d]=e.data.split('-');return `${d}/${m}/${a}`+(e.hora?` às ${e.hora}`:'');}
function metaEv(e){return [fmtData(e),e.local].filter(Boolean).join(' · ');}
const BASE=location.href.split(/[?#]/)[0];
const linkVoucher=id=>BASE+'?v='+id;
function gerarCodigo(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(6));r.forEach(n=>s+=a[n%a.length]);return s;}
function cpfValido(c){c=c.replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);if(((s*10)%11)%10!==+c[t])return false;}return true;}
function mascaraCPF(el){let v=el.value.replace(/\D/g,'').slice(0,11);v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');el.value=v;}
function mascaraTel(el){let v=el.value.replace(/\D/g,'').slice(0,11);if(v.length>10)v=v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');else if(v.length>6)v=v.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3');else if(v.length>2)v=v.replace(/(\d{2})(\d+)/,'($1) $2');el.value=v;}
function meus(){try{return JSON.parse(localStorage.getItem('meusVouchers')||'[]');}catch(e){return[];}}
function guardar(v){const l=meus().filter(x=>x.id!==v.id);l.unshift(v);localStorage.setItem('meusVouchers',JSON.stringify(l.slice(0,50)));}
function topo(sm,t,m){$('topSmall').textContent=sm;$('topTitulo').textContent=t;$('topMeta').textContent=m||'';document.title=t;}
function tela(html){$('conteudo').innerHTML=html;}
function moeda(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function cobra(ev){return !!(ev&&ev.pix&&ev.pix.ativo&&ev.pix.valor>0);}
function banner(ev){return ev&&ev.imagem?`<img class="banner" src="${ev.imagem}" alt="">`:'';}
function camposDoEvento(e){
  if(!e)return[];
  if(Array.isArray(e.camposExtras))return e.camposExtras;
  if(e.campos&&e.campos.extra&&e.extraLabel)return[{id:'extra',label:e.extraLabel,tipo:'texto',obrigatorio:true,opcoes:[]}];
  return[];
}
function campoHTML(f,k){
  const id='fx'+k,lb=`<label for="${id}">${esc(f.label)}${f.obrigatorio?' *':''}</label>`;
  switch(f.tipo){
    case 'textolongo':return lb+`<textarea id="${id}" maxlength="500"></textarea>`;
    case 'numero':return lb+`<input id="${id}" type="number" inputmode="decimal">`;
    case 'data':return lb+`<input id="${id}" type="date">`;
    case 'opcoes':return lb+`<select id="${id}"><option value="">Selecione…</option>${(f.opcoes||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
    case 'simnao':return lb+`<select id="${id}"><option value="">Selecione…</option><option>Sim</option><option>Não</option></select>`;
    default:return lb+`<input id="${id}" maxlength="150">`;
  }
}

/* ================== Pix (BR Code "copia e cola") ================== */
function tlv(id,v){v=String(v);return id+String(v.length).padStart(2,'0')+v;}
function semAcento(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').replace(/\s+/g,' ').trim().toUpperCase();}
function chavePix(p){
  const k=String(p.chave||'').trim();
  if(p.tipo==='cpf')return k.replace(/\D/g,'');
  if(p.tipo==='tel'){let d=k.replace(/\D/g,'');if(!(d.length>=12&&d.startsWith('55')))d='55'+d;return '+'+d;}
  if(p.tipo==='email')return k.toLowerCase();
  return k;
}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}return c.toString(16).toUpperCase().padStart(4,'0');}
function brcode(p,txid){
  const s=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',chavePix(p)))+tlv('52','0000')+tlv('53','986')
    +(p.valor>0?tlv('54',Number(p.valor).toFixed(2)):'')+tlv('58','BR')
    +tlv('59',semAcento(p.nome).slice(0,25)||'RECEBEDOR')+tlv('60',semAcento(p.cidade).slice(0,15)||'BRASIL')
    +tlv('62',tlv('05',String(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';
  return s+crc16(s);
}

(function(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#4338ca';x.fillRect(0,0,64,64);x.fillStyle='#fff';x.fillRect(12,18,40,28);$('favIcon').href=c.toDataURL();})();

/* ================== Firebase ================== */
const configurado=!String(firebaseConfig.apiKey).startsWith('COLE');
let db;
if(configurado){firebase.initializeApp(firebaseConfig);db=firebase.firestore();}
const P=new URLSearchParams(location.search);
let evento=null;

(async function inicio(){
  if(!configurado){topo('Inscrição','Configuração pendente');tela('<div class="card">Cole a configuração do Firebase no arquivo <b>inscricao.html</b>.</div>');return;}
  try{
    if(P.get('v'))return await abrirVoucher(P.get('v'));
    if(P.get('e'))return await abrirFormulario(P.get('e'));
    listaMeus();
  }catch(e){topo('Inscrição','Não foi possível carregar');tela(`<div class="card"><div class="msg bad">${esc(e.code==='unavailable'?'Sem conexão com a internet. Tente novamente.':e.message)}</div></div>`);}
})();

function listaMeus(){
  topo('Inscrição','Meus vouchers');
  const l=meus();
  tela(`<div class="card">${l.length?l.map(v=>`<a class="item" href="?v=${esc(v.id)}"><b>${esc(v.titulo)}</b><br><span class="muted">${esc(v.nome)} · ${esc(v.codigo||'')}</span></a>`).join(''):'<p class="muted center">Nenhum voucher salvo neste aparelho.<br>Use o link de inscrição enviado pelo organizador.</p>'}</div>`);
}

/* ================== Formulário ================== */
async function abrirFormulario(eid){
  const d=await db.collection('eventos').doc(eid).get();
  if(!d.exists){topo('Inscrição','Evento não encontrado');tela('<div class="card"><p class="muted center">Este link de inscrição não é válido ou o evento foi removido.</p></div>');return;}
  evento={id:d.id,...d.data()};
  topo('Inscrição',evento.titulo,metaEv(evento));
  const ja=meus().find(v=>v.eventoId===eid);
  const aviso=ja?`<div class="msg ok">Você já se inscreveu neste evento neste aparelho. <a href="?v=${esc(ja.id)}"><b>Ver meu voucher</b></a></div>`:'';
  if(!evento.aberto){tela(`<div class="card">${banner(evento)}${evento.descricao?`<p class="desc">${esc(evento.descricao)}</p>`:''}<div class="msg bad">As inscrições para este evento estão encerradas.</div>${aviso}</div>`);return;}
  const c=evento.campos||{};
  tela(`<div class="card">
    ${banner(evento)}
    ${evento.descricao?`<p class="desc">${esc(evento.descricao)}</p>`:''}${aviso}
    ${cobra(evento)?`<div class="preco"><span>Valor da inscrição</span><b>${esc(moeda(evento.pix.valor))}</b></div><div class="muted">O pagamento é feito por Pix logo após a inscrição.</div>`:''}
    <form id="form" novalidate>
      <label>Nome completo *</label><input id="fNome" autocomplete="name" maxlength="120">
      ${c.cpf?`<label>CPF *</label><input id="fCpf" inputmode="numeric" placeholder="000.000.000-00" oninput="mascaraCPF(this)">`:''}
      ${c.telefone?`<label>Telefone / WhatsApp *</label><input id="fTel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" oninput="mascaraTel(this)">`:''}
      ${c.email?`<label>E-mail *</label><input id="fEmail" type="email" autocomplete="email" maxlength="120">`:''}
      ${camposDoEvento(evento).map((f,k)=>campoHTML(f,k)).join('')}
      <div id="erro"></div>
      <button class="btn pri" id="btnEnviar" type="submit">Confirmar inscrição</button>
      <p class="priv">Seus dados serão usados somente para a organização e o controle de entrada deste evento.</p>
    </form></div>`);
  $('form').onsubmit=e=>{e.preventDefault();enviar();};
}

async function enviar(){
  const c=evento.campos||{};const erros=[];
  document.querySelectorAll('.err').forEach(i=>i.classList.remove('err'));
  const marca=(id,msg)=>{$(id).classList.add('err');erros.push(msg);};
  const nome=$('fNome').value.trim().replace(/\s+/g,' ');
  if(nome.length<3)marca('fNome','Informe seu nome completo.');
  const cpf=c.cpf?$('fCpf').value.replace(/\D/g,''):'';
  if(c.cpf&&!cpfValido(cpf))marca('fCpf','CPF inválido.');
  const tel=c.telefone?$('fTel').value.trim():'';
  if(c.telefone&&tel.replace(/\D/g,'').length<10)marca('fTel','Telefone incompleto.');
  const email=c.email?$('fEmail').value.trim():'';
  if(c.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))marca('fEmail','E-mail inválido.');
  const extra='',respostas={};
  camposDoEvento(evento).forEach((f,k)=>{
    const v=$('fx'+k).value.trim();
    if(f.obrigatorio&&!v)marca('fx'+k,'Preencha o campo "'+f.label+'".');
    if(v)respostas[f.id]=v.slice(0,500);
  });
  if(erros.length){$('erro').innerHTML=`<div class="msg bad">${erros.map(esc).join('<br>')}</div>`;return;}
  $('erro').innerHTML='';$('btnEnviar').disabled=true;$('btnEnviar').textContent='Enviando…';

  const ref=db.collection('inscricoes').doc();
  const dados={eventoId:evento.id,codigo:gerarCodigo(),nome,cpf,telefone:tel,email,extra,respostas,checkin:false,checkinEm:null,pago:false,pagoEm:null,criadoEm:firebase.firestore.FieldValue.serverTimestamp()};
  const b=db.batch();b.set(ref,dados);
  if(c.cpf)b.set(db.collection('bloqueios').doc(evento.id+'_'+cpf),{eventoId:evento.id,inscricaoId:ref.id});
  try{
    await b.commit();
    guardar({id:ref.id,eventoId:evento.id,titulo:evento.titulo,nome,codigo:dados.codigo});
    history.replaceState(null,'','?v='+ref.id);
    mostrarVoucher({id:ref.id,...dados},evento,true);
  }catch(e){
    let msg=e.message;
    if(e.code==='permission-denied'){
      let aberto=true;try{aberto=(await db.collection('eventos').doc(evento.id).get()).data().aberto;}catch(x){}
      msg=!aberto?'As inscrições foram encerradas.':c.cpf?'Este CPF já está inscrito neste evento. Se você perdeu o voucher, fale com a organização.':'Não foi possível concluir a inscrição.';
    }else if(e.code==='unavailable')msg='Sem conexão com a internet. Tente novamente.';
    $('erro').innerHTML=`<div class="msg bad">${esc(msg)}</div>`;
    $('btnEnviar').disabled=false;$('btnEnviar').textContent='Confirmar inscrição';
  }
}

/* ================== Voucher ================== */
async function abrirVoucher(vid){
  const d=await db.collection('inscricoes').doc(vid).get();
  if(!d.exists){topo('Voucher','Voucher não encontrado');tela('<div class="card"><p class="muted center">Este voucher não existe ou a inscrição foi cancelada.</p></div>');return;}
  const i={id:d.id,...d.data()};
  const e=await db.collection('eventos').doc(i.eventoId).get();
  const ev=e.exists?{id:e.id,...e.data()}:{titulo:'Evento'};
  guardar({id:i.id,eventoId:i.eventoId,titulo:ev.titulo,nome:i.nome,codigo:i.codigo});
  mostrarVoucher(i,ev,false);
}
let atual=null;
function mostrarVoucher(i,ev,novo){
  atual={i,ev,img:null};
  if(ev.imagem){const im=new Image();im.src=ev.imagem;atual.img=im;}
  topo('Voucher de inscrição',ev.titulo,metaEv(ev));
  const px=cobra(ev);
  tela(`<div class="card voucher">
    ${banner(ev)}
    ${novo?`<div class="msg ok" style="margin-top:0">✅ Inscrição realizada!${px&&!i.pago?' Falta só o pagamento via Pix (abaixo).':''}</div>`:''}
    ${i.checkin?'<div class="msg bad" style="margin-top:0">Este voucher já foi utilizado na entrada.</div>':''}
    ${px?`<div style="margin-top:12px"><span class="st ${i.pago?'ok':'pend'}">${i.pago?'✔ Pagamento confirmado':'⏳ Pagamento pendente'}</span></div>`:''}
    <div class="muted" style="margin-top:12px">Participante</div>
    <div class="nome">${esc(i.nome)}</div>
    <div class="qrbox"><div id="qr"></div></div>
    <div class="muted">Código</div><div class="codigo">${esc(i.codigo)}</div>
    <p class="muted">Apresente este QR code na entrada do evento.</p>
    <button class="btn pri" onclick="compartilhar()">📤 Salvar / compartilhar voucher</button>
    <div class="row"><button class="btn" onclick="baixar()">⬇ Baixar imagem</button><button class="btn" onclick="copiarLink()">🔗 Copiar link</button></div>
  </div>
  ${px&&!i.pago?cartaoPix(i,ev):''}
  ${ev.descricao?`<div class="card"><p class="desc" style="margin:0">${esc(ev.descricao)}</p></div>`:''}`);
  new QRCode($('qr'),{text:linkVoucher(i.id),width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  if(px&&!i.pago)new QRCode($('qrPix'),{text:atual.pix,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
}
function cartaoPix(i,ev){
  const p=ev.pix;atual.pix=brcode(p,'INSC'+i.codigo);
  return `<div class="card pix center">
    <h3>Pagamento via Pix</h3>
    <div class="valor">${esc(moeda(p.valor))}</div>
    <div class="muted">Abra o app do seu banco, escolha <b>Pix → Ler QR code</b> ou <b>Pix copia e cola</b>.</div>
    <div class="qrbox"><div id="qrPix"></div></div>
    <textarea class="copia" id="pixCopia" readonly onclick="this.select()">${esc(atual.pix)}</textarea>
    <button class="btn pri" onclick="copiarTexto(atual.pix,'Código Pix copiado! Cole no app do banco.')">📋 Copiar Pix copia e cola</button>
    <div style="margin-top:14px">
      <div class="kvp"><span>Recebedor</span><b>${esc(p.nome)}</b></div>
      <div class="kvp"><span>Chave Pix</span><b>${esc(p.chave)}</b></div>
    </div>
    <button class="btn" onclick="copiarTexto(${esc(JSON.stringify(p.chave))},'Chave Pix copiada!')">Copiar só a chave</button>
    ${p.whats?`<button class="btn" onclick="enviarComprovante()">💬 Enviar comprovante pelo WhatsApp</button>`:''}
    <p class="muted" style="margin-bottom:0">Depois que a organização confirmar o pagamento, esta página mostra <b>Pagamento confirmado</b>.</p>
    <button class="btn" onclick="location.reload()">🔄 Atualizar situação</button>
  </div>`;
}
function copiarTexto(t,ok){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert(ok)).catch(()=>prompt('Copie:',t));}
function enviarComprovante(){
  const {i,ev}=atual;let d=String(ev.pix.whats||'').replace(/\D/g,'');if(!(d.length>=12&&d.startsWith('55')))d='55'+d;
  const msg=`Olá! Segue o comprovante do Pix da minha inscrição.\nEvento: ${ev.titulo}\nNome: ${i.nome}\nCódigo: ${i.codigo}\nValor: ${moeda(ev.pix.valor)}`;
  window.open('https://wa.me/'+d+'?text='+encodeURIComponent(msg),'_blank');
}
function quebra(x,t,cx,y,maxW,lh,maxL){const ps=String(t).split(' ');let l='',n=1;for(const p of ps){const tt=l?l+' '+p:p;if(x.measureText(tt).width>maxW&&l){if(n>=maxL){x.fillText(l+'…',cx,y);return y;}x.fillText(l,cx,y);y+=lh;n++;l=p;}else l=tt;}x.fillText(l,cx,y);return y;}
function imagemVoucher(){
  const {i,ev}=atual;
  const tmp=document.createElement('div');new QRCode(tmp,{text:linkVoucher(i.id),width:520,height:520,correctLevel:QRCode.CorrectLevel.M});
  const q=tmp.querySelector('canvas');
  const W=800,H=1180,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#f4f5fb';x.fillRect(0,0,W,H);
  x.fillStyle='#4338ca';x.fillRect(0,0,W,250);
  const im=atual.img;
  if(im&&im.complete&&im.naturalWidth){
    const s=Math.max(W/im.naturalWidth,250/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;
    x.drawImage(im,(W-dw)/2,(250-dh)/2,dw,dh);
    x.fillStyle='rgba(20,22,60,.62)';x.fillRect(0,0,W,250);
  }
  x.fillStyle='#fff';x.textAlign='center';
  x.font='600 24px system-ui,sans-serif';x.fillText('VOUCHER DE INSCRIÇÃO',W/2,56);
  x.font='bold 40px system-ui,sans-serif';const y=quebra(x,ev.titulo,W/2,114,W-70,48,2);
  x.font='26px system-ui,sans-serif';x.fillText(metaEv(ev),W/2,y+48);
  x.fillStyle='#fff';x.beginPath();x.moveTo(60,290);x.arcTo(740,290,740,1120,24);x.arcTo(740,1120,60,1120,24);x.arcTo(60,1120,60,290,24);x.arcTo(60,290,740,290,24);x.fill();
  x.fillStyle='#6b6f85';x.font='24px system-ui,sans-serif';x.fillText('Participante',W/2,345);
  x.fillStyle='#1c1d29';x.font='bold 38px system-ui,sans-serif';quebra(x,i.nome,W/2,395,W-160,44,2);
  x.drawImage(q,140,450,520,520);
  x.fillStyle='#6b6f85';x.font='24px system-ui,sans-serif';x.fillText('Código',W/2,1015);
  x.fillStyle='#4338ca';x.font='bold 46px system-ui,sans-serif';x.fillText(i.codigo.split('').join(' '),W/2,1068);
  x.fillStyle='#6b6f85';x.font='22px system-ui,sans-serif';x.fillText('Apresente este QR code na entrada',W/2,1160);
  return c;
}
function nomeArq(){return 'voucher-'+atual.i.codigo+'.png';}
function baixar(){const a=document.createElement('a');a.href=imagemVoucher().toDataURL('image/png');a.download=nomeArq();a.click();}
function compartilhar(){
  imagemVoucher().toBlob(async blob=>{
    const f=new File([blob],nomeArq(),{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:'Voucher — '+atual.ev.titulo,text:'Meu voucher: '+linkVoucher(atual.i.id)});}catch(e){}
    }else baixar();
  },'image/png');
}
function copiarLink(){const t=linkVoucher(atual.i.id);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Link do voucher copiado!')).catch(()=>prompt('Copie o link:',t));}
