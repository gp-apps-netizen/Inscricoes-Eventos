<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inscrição</title>
<meta name="theme-color" content="#4338ca">
<link rel="icon" id="favIcon">
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#1c1d29;--muted:#6b6f85;--line:#e3e5ee;--pri:#4338ca;--pri2:#eef0ff;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2}
@media (prefers-color-scheme:dark){:root{--bg:#12131a;--card:#1c1d27;--text:#eceef6;--muted:#9a9db3;--line:#2d2f3d;--pri:#818cf8;--pri2:#262a4a;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
.top{background:#4338ca;color:#fff;padding:26px 16px 60px;padding-top:calc(26px + env(safe-area-inset-top))}
@media (prefers-color-scheme:dark){.top{background:#2b2f6b}}
.top .in{max-width:560px;margin:0 auto}
.top small{opacity:.85;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.top h1{margin:6px 0 8px;font-size:24px;line-height:1.2}
.top .meta{opacity:.92;font-size:15px}
main{max-width:560px;margin:-40px auto 0;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(20,20,60,.06)}
.desc{white-space:pre-wrap;font-size:15px;color:var(--muted);margin:0 0 6px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card);color:var(--text);font-family:inherit}
textarea{min-height:80px;resize:vertical}
input.err,select.err,textarea.err{border-color:var(--bad)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:13px;font-size:16px;cursor:pointer;margin-top:10px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.btn.pri{color:#12131a}}
.btn:disabled{opacity:.6}
.muted{color:var(--muted);font-size:14px}
.msg{padding:12px;border-radius:10px;font-size:15px;margin-top:12px}
.msg.bad{background:var(--badbg);color:var(--bad)}
.msg.ok{background:var(--okbg);color:var(--ok)}
.voucher{text-align:center}
.voucher .nome{font-size:22px;font-weight:700;margin:4px 0}
.qrbox{display:inline-block;padding:12px;background:#fff;border-radius:12px;margin:12px 0 4px;border:1px solid #e3e5ee}
.codigo{font-size:26px;font-weight:800;letter-spacing:.2em;color:var(--pri)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.item{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none}
.item:last-child{border-bottom:0}
.center{text-align:center}
.hidden{display:none!important}
.spin{width:32px;height:32px;border:3px solid var(--pri2);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
.termo{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.termoTxt{white-space:pre-wrap;font-size:14px;line-height:1.45;max-height:240px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:8px;color:var(--text)}
.chkp.err{outline:2px solid var(--bad)}
.chkp{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--pri2);color:var(--pri);font-size:15px;cursor:pointer}
.chkp input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--pri)}
.priv{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.4}
.banner{display:block;width:calc(100% + 36px);margin:-18px -18px 16px;max-height:260px;object-fit:cover;border-radius:15px 15px 0 0}
.preco{display:flex;justify-content:space-between;align-items:center;background:var(--pri2);color:var(--pri);border-radius:10px;padding:10px 12px;margin:10px 0 4px;font-size:15px}
.preco b{font-size:18px}
.pix h3{margin:0 0 4px;font-size:18px}
.pix .valor{font-size:28px;font-weight:800;margin:4px 0}
.copia{width:100%;min-height:74px;font-family:ui-monospace,monospace;font-size:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);resize:none;word-break:break-all}
.st{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700}
.st.pend{background:#fef3c7;color:#92400e}
.st.ok{background:var(--okbg);color:var(--ok)}
.kvp{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);text-align:left}
.kvp span{color:var(--muted)}
.kvp b{word-break:break-all;text-align:right}
</style>
</head>
<body>

<script>

const firebaseConfig = {

<div class="top"><div class="in">
  <small id="topSmall">Inscrição</small>
  <h1 id="topTitulo">Carregando…</h1>
  <div class="meta" id="topMeta"></div>
</div></div>
<main id="conteudo"><div class="card"><div class="spin"></div></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
/* ================== Utilidades ================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtData(e){if(!e||!e.data)return '';const[a,m,d]=e.data.split('-');return `${d}/${m}/${a}`+(e.hora?` às ${e.hora}`:'');}
function metaEv(e){return [fmtData(e),e.local].filter(Boolean).join(' · ');}
const BASE=location.href.split(/[?#]/)[0];
const linkVoucher=id=>BASE+'?v='+id;
function gerarCodigo(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(6));r.forEach(n=>s+=a[n%a.length]);return s;}
function cpfValido(c){c=c.replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);if(((s*10)%11)%10!==+c[t])return false;}return true;}
function mascaraCPF(el){let v=el.value.replace(/\D/g,'').slice(0,11);v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');el.value=v;}
function mascaraTel(el){let v=el.value.replace(/\D/g,'').slice(0,11);if(v.length>10)v=v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');else if(v.length>6)v=v.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3');else if(v.length>2)v=v.replace(/(\d{2})(\d+)/,'($1) $2');el.value=v;}
function meus(){try{return JSON.parse(localStorage.getItem('meusVouchers')||'[]');}catch(e){return[];}}
function guardar(v){const l=meus().filter(x=>x.id!==v.id);l.unshift(v);localStorage.setItem('meusVouchers',JSON.stringify(l.slice(0,50)));}
function topo(sm,t,m){$('topSmall').textContent=sm;$('topTitulo').textContent=t;$('topMeta').textContent=m||'';document.title=t;}
function tela(html){$('conteudo').innerHTML=html;}
function moeda(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function cobra(ev){return !!(ev&&ev.pix&&ev.pix.ativo&&ev.pix.valor>0);}
function temMeia(ev){return cobra(ev)&&!!ev.pix.meia&&ev.pix.valorMeia>0;}
function valorDe(i,ev){if(!cobra(ev)||i.isento)return 0;return i.meia&&temMeia(ev)?Number(ev.pix.valorMeia):Number(ev.pix.valor);}
const termoAtivo=e=>!!(e&&e.termo&&e.termo.ativo);
const textoTermo=e=>String((e.termo&&e.termo.texto)||'').split('{evento}').join(e.titulo||'');
const tituloTermo=e=>(e.termo&&e.termo.titulo)||'Termo de Responsabilidade';
function criancasGratis(ev){return cobra(ev)&&!!ev.pix.criancasGratis;}
function idadeNaData(nasc,ev){const ref=ev&&ev.data?new Date(ev.data+'T12:00:00'):new Date(),n=new Date(nasc+'T12:00:00');let a=ref.getFullYear()-n.getFullYear();if(ref.getMonth()<n.getMonth()||(ref.getMonth()===n.getMonth()&&ref.getDate()<n.getDate()))a--;return a;}
function banner(ev){return ev&&ev.imagem?`<img class="banner" src="${ev.imagem}" alt="">`:'';}
function camposDoEvento(e){
  if(!e)return[];
  if(Array.isArray(e.camposExtras))return e.camposExtras;
  if(e.campos&&e.campos.extra&&e.extraLabel)return[{id:'extra',label:e.extraLabel,tipo:'texto',obrigatorio:true,opcoes:[]}];
  return[];
}
function campoHTML(f,k){
  const id='fx'+k,lb=`<label for="${id}">${esc(f.label)}${f.obrigatorio?' *':''}</label>`;
  switch(f.tipo){
    case 'textolongo':return lb+`<textarea id="${id}" maxlength="500"></textarea>`;
    case 'numero':return lb+`<input id="${id}" type="number" inputmode="decimal">`;
    case 'data':return lb+`<input id="${id}" type="date">`;
    case 'opcoes':return lb+`<select id="${id}"><option value="">Selecione…</option>${(f.opcoes||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
    case 'simnao':return lb+`<select id="${id}"><option value="">Selecione…</option><option>Sim</option><option>Não</option></select>`;
    default:return lb+`<input id="${id}" maxlength="150">`;
  }
}

/* ================== Pix (BR Code "copia e cola") ================== */
function tlv(id,v){v=String(v);return id+String(v.length).padStart(2,'0')+v;}
function semAcento(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').replace(/\s+/g,' ').trim().toUpperCase();}
function chavePix(p){
  const k=String(p.chave||'').trim();
  if(p.tipo==='cpf')return k.replace(/\D/g,'');
  if(p.tipo==='tel'){let d=k.replace(/\D/g,'');if(!(d.length>=12&&d.startsWith('55')))d='55'+d;return '+'+d;}
  if(p.tipo==='email')return k.toLowerCase();
  return k;
}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}return c.toString(16).toUpperCase().padStart(4,'0');}
function brcode(p,txid){
  const s=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',chavePix(p)))+tlv('52','0000')+tlv('53','986')
    +(p.valor>0?tlv('54',Number(p.valor).toFixed(2)):'')+tlv('58','BR')
    +tlv('59',semAcento(p.nome).slice(0,25)||'RECEBEDOR')+tlv('60',semAcento(p.cidade).slice(0,15)||'BRASIL')
    +tlv('62',tlv('05',String(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';
  return s+crc16(s);
}

(function(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#4338ca';x.fillRect(0,0,64,64);x.fillStyle='#fff';x.fillRect(12,18,40,28);$('favIcon').href=c.toDataURL();})();

/* ================== Firebase ================== */
const configurado=!String(firebaseConfig.apiKey).startsWith('COLE');
let db;
if(configurado){firebase.initializeApp(firebaseConfig);db=firebase.firestore();}
const P=new URLSearchParams(location.search);
const MAX_GRUPO=10;
let evento=null;

(async function inicio(){
  if(!configurado){topo('Inscrição','Configuração pendente');tela('<div class="card">Cole a configuração do Firebase no arquivo <b>inscricao.html</b>.</div>');return;}
  try{
    if(P.get('v'))return await abrirVouchers([P.get('v')],true);
    if(P.get('vs'))return await abrirVouchers(P.get('vs').split(',').filter(Boolean).slice(0,MAX_GRUPO),false);
    if(P.get('e'))return await abrirFormulario(P.get('e'));
    listaMeus();
  }catch(e){topo('Inscrição','Não foi possível carregar');tela(`<div class="card"><div class="msg bad">${esc(e.code==='unavailable'?'Sem conexão com a internet. Tente novamente.':e.message)}</div></div>`);}
})();

function listaMeus(){
  topo('Inscrição','Meus vouchers');
  const l=meus();
  tela(`<div class="card">${l.length?l.map(v=>`<a class="item" href="?v=${esc(v.id)}"><b>${esc(v.titulo)}</b><br><span class="muted">${esc(v.nome)} · ${esc(v.codigo||'')}</span></a>`).join(''):'<p class="muted center">Nenhum voucher salvo neste aparelho.<br>Use o link de inscrição enviado pelo organizador.</p>'}</div>`);
}

/* ================== Formulário (uma ou várias pessoas) ================== */
let seqP=0;
async function abrirFormulario(eid){
  const d=await db.collection('eventos').doc(eid).get();
  if(!d.exists){topo('Inscrição','Evento não encontrado');tela('<div class="card"><p class="muted center">Este link de inscrição não é válido ou o evento foi removido.</p></div>');return;}
  evento={id:d.id,...d.data()};
  topo('Inscrição',evento.titulo,metaEv(evento));
  const ja=meus().filter(v=>v.eventoId===eid);
  const aviso=ja.length?`<div class="msg ok">Já existe inscrição feita neste aparelho para este evento. <a href="?vs=${esc(ja.map(v=>v.id).join(','))}"><b>Ver voucher${ja.length>1?'s':''}</b></a></div>`:'';
  if(!evento.aberto){tela(`<div class="card">${banner(evento)}${evento.descricao?`<p class="desc">${esc(evento.descricao)}</p>`:''}<div class="msg bad">As inscrições para este evento estão encerradas.</div>${aviso}</div>`);return;}
  seqP=0;
  tela(`<div class="card">
    ${banner(evento)}
    ${evento.descricao?`<p class="desc">${esc(evento.descricao)}</p>`:''}${aviso}
    ${cobra(evento)?`<div class="preco"><span>Valor por pessoa</span><b>${esc(moeda(evento.pix.valor))}</b></div>${temMeia(evento)?`<div class="preco"><span>Meia-entrada${evento.pix.meiaQuem?' <small>('+esc(evento.pix.meiaQuem)+')</small>':''}</span><b>${esc(moeda(evento.pix.valorMeia))}</b></div>`:''}<div class="muted">O pagamento é feito por Pix logo após a inscrição.</div>`:''}
  </div>
  <form id="form" novalidate>
    <div id="pessoas"></div>
    <div class="card">
      <button class="btn" type="button" id="btnAddP" onclick="addPessoa()">👥 + Inscrever mais uma pessoa</button>
      <div class="muted center" style="margin-top:8px">Você pode inscrever até ${MAX_GRUPO} pessoas de uma vez. Cada uma recebe o seu próprio voucher.</div>
      ${termoAtivo(evento)?`<div class="termo"><b>${esc(tituloTermo(evento))}</b>
        <div class="termoTxt">${esc(textoTermo(evento))}</div>
        <label class="chkp" id="aceiteLbl"><input type="checkbox" id="aceiteTermo"> <span>Li e aceito o ${esc(tituloTermo(evento).toLowerCase())}<span id="termoGrupo"></span>.</span></label></div>`:''}
      <div id="total"></div>
      <div id="erro"></div>
      <button class="btn pri" id="btnEnviar" type="submit">Confirmar inscrição</button>
      <p class="priv">Os dados serão usados somente para a organização e o controle de entrada deste evento.</p>
    </div>
  </form>`);
  addPessoa(true);
  $('form').onsubmit=e=>{e.preventDefault();enviar();};
}
function pessoaHTML(n,primeira){
  const c=evento.campos||{},p='p'+n+'_';
  return `<div class="card pessoa" data-p="${n}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
      <b class="ptit">Pessoa 1</b>
      ${primeira?'':`<button type="button" class="btn" style="width:auto;margin:0;padding:6px 12px;font-size:14px;color:var(--bad)" onclick="remPessoa(${n})">Remover</button>`}
    </div>
    <label>Nome completo *</label><input id="${p}nome" autocomplete="${primeira?'name':'off'}" maxlength="120">
    ${criancasGratis(evento)?`<label class="chkp"><input type="checkbox" id="${p}cri" onchange="toggleCrianca(${n})"> 🎈 Criança de até ${esc(evento.pix.idadeMax)} anos — inscrição gratuita</label>
      <div id="${p}criBox" class="hidden"><label>Data de nascimento *</label><input id="${p}nasc" type="date"></div>`:''}
    ${temMeia(evento)?`<label class="chkp" id="${p}meiaLbl"><input type="checkbox" id="${p}meia" onchange="toggleMeia(${n})"> 🎟 Pagar meia-entrada (${esc(moeda(evento.pix.valorMeia))})</label>
      <div id="${p}meiaBox" class="hidden">
        ${evento.pix.meiaQuem?`<div class="muted" style="margin-top:6px">Têm direito: ${esc(evento.pix.meiaQuem)}. Leve o comprovante no dia.</div>`:'<div class="muted" style="margin-top:6px">Leve o comprovante no dia.</div>'}
        <label>Motivo da meia-entrada *</label><input id="${p}meiaMot" maxlength="80" placeholder="Ex.: estudante, idoso, professor">
      </div>`:''}
    ${c.cpf?`<label id="${p}cpfLbl">CPF *</label><input id="${p}cpf" inputmode="numeric" placeholder="000.000.000-00" oninput="mascaraCPF(this)">`:''}
    ${c.telefone?`<label>Telefone / WhatsApp ${primeira?'*':'<span class="muted">(se vazio, usa o da pessoa 1)</span>'}</label><input id="${p}tel" inputmode="tel" ${primeira?'autocomplete="tel"':''} placeholder="(00) 00000-0000" oninput="mascaraTel(this)">`:''}
    ${c.email?`<label>E-mail ${primeira?'*':'<span class="muted">(se vazio, usa o da pessoa 1)</span>'}</label><input id="${p}email" type="email" ${primeira?'autocomplete="email"':''} maxlength="120">`:''}
    ${camposDoEvento(evento).map((f,k)=>campoHTML(f,k).replace(/id="fx(\d+)"/,`id="${p}fx$1"`).replace(/for="fx(\d+)"/,`for="${p}fx$1"`)).join('')}
  </div>`;
}
function toggleMeia(n){const p='p'+n+'_';$(p+'meiaBox').classList.toggle('hidden',!$(p+'meia').checked);atualizarPessoas();}
function ehMeia(el){const c=el.querySelector('input[id$="_meia"]');return !!(c&&c.checked)&&!ehCrianca(el);}
function toggleCrianca(n){const p='p'+n+'_',on=$(p+'cri').checked;if($(p+'meiaLbl')){$(p+'meiaLbl').classList.toggle('hidden',on);$(p+'meiaBox').classList.toggle('hidden',on||!$(p+'meia').checked);}$(p+'criBox').classList.toggle('hidden',!on);if($(p+'cpfLbl'))$(p+'cpfLbl').innerHTML=on?'CPF <span class="muted">(opcional para criança)</span>':'CPF *';atualizarPessoas();}
function ehCrianca(el){const c=el.querySelector('input[id$="_cri"]');return !!(c&&c.checked);}
function blocos(){return [...document.querySelectorAll('.pessoa')];}
function addPessoa(primeira){
  if(blocos().length>=MAX_GRUPO)return alert('Máximo de '+MAX_GRUPO+' pessoas por vez.');
  $('pessoas').insertAdjacentHTML('beforeend',pessoaHTML(++seqP,!!primeira));
  atualizarPessoas();
  if(!primeira){const b=blocos();b[b.length-1].scrollIntoView({behavior:'smooth',block:'start'});$('p'+seqP+'_nome').focus({preventScroll:true});}
}
function remPessoa(n){const el=document.querySelector(`.pessoa[data-p="${n}"]`);if(el)el.remove();atualizarPessoas();}
function atualizarPessoas(){
  const b=blocos();
  b.forEach((el,k)=>el.querySelector('.ptit').textContent=b.length>1?'Pessoa '+(k+1):'Seus dados');
  $('btnAddP').classList.toggle('hidden',b.length>=MAX_GRUPO);
  if($('termoGrupo'))$('termoGrupo').textContent=b.length>1?' em nome de todas as pessoas desta inscrição':'';
  $('btnEnviar').textContent=b.length>1?`Confirmar ${b.length} inscrições`:'Confirmar inscrição';
  const cri=b.filter(ehCrianca).length,meia=b.filter(ehMeia).length,int=b.length-cri-meia;
  const partes=[];if(int)partes.push(int+' inteira'+(int>1?'s':''));if(meia)partes.push(meia+' meia'+(meia>1?'s':''));if(cri)partes.push(cri+' criança'+(cri>1?'s':'')+' grátis');
  const tot=int*evento.pix.valor+meia*(temMeia(evento)?evento.pix.valorMeia:0);
  $('total').innerHTML=cobra(evento)&&(b.length>1||cri||meia)?`<div class="preco"><span>Total (${partes.join(' + ')})</span><b>${esc(moeda(tot))}</b></div>`:'';
}

async function enviar(){
  const c=evento.campos||{},erros=[],pessoas=[];
  document.querySelectorAll('.err').forEach(i=>i.classList.remove('err'));
  const b=blocos();
  b.forEach((el,k)=>{
    const p='p'+el.dataset.p+'_',quem=b.length>1?`Pessoa ${k+1}: `:'';
    const marca=(id,msg)=>{$(p+id).classList.add('err');erros.push(quem+msg);};
    const val=id=>($(p+id)?$(p+id).value.trim():'');
    const nome=val('nome').replace(/\s+/g,' ');
    if(nome.length<3)marca('nome','informe o nome completo.');
    const crianca=criancasGratis(evento)&&ehCrianca(el);
    let nasc='';
    if(crianca){
      nasc=val('nasc');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(nasc))marca('nasc','informe a data de nascimento da criança.');
      else{const id=idadeNaData(nasc,evento);
        if(id<0||new Date(nasc+'T12:00:00')>new Date())marca('nasc','data de nascimento inválida.');
        else if(id>evento.pix.idadeMax)marca('nasc',`pela data de nascimento terá ${id} anos no evento — a gratuidade é até ${evento.pix.idadeMax} anos. Desmarque "Criança" para inscrever como pagante.`);}
    }
    const meia=temMeia(evento)&&ehMeia(el);let meiaMotivo='';
    if(meia){meiaMotivo=val('meiaMot');if(meiaMotivo.length<3)marca('meiaMot','informe o motivo da meia-entrada.');}
    const cpf=c.cpf?val('cpf').replace(/\D/g,''):'';
    if(c.cpf&&!(crianca&&!cpf)&&!cpfValido(cpf))marca('cpf','CPF inválido.');
    let tel=c.telefone?val('tel'):'';
    if(c.telefone&&k>0&&!tel)tel=pessoas[0]?pessoas[0].telefone:'';
    else if(c.telefone&&tel.replace(/\D/g,'').length<10)marca('tel','telefone incompleto.');
    let email=c.email?val('email'):'';
    if(c.email&&k>0&&!email)email=pessoas[0]?pessoas[0].email:'';
    else if(c.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))marca('email','e-mail inválido.');
    const respostas={};
    camposDoEvento(evento).forEach((f,j)=>{
      const v=val('fx'+j);
      if(f.obrigatorio&&!v)marca('fx'+j,'preencha "'+f.label+'".');
      if(v)respostas[f.id]=v.slice(0,500);
    });
    pessoas.push({nome,cpf,telefone:tel,email,respostas,el,crianca,nasc,meia,meiaMotivo});
  });
  if(termoAtivo(evento)){$('aceiteLbl').classList.remove('err');if(!$('aceiteTermo').checked){$('aceiteLbl').classList.add('err');erros.push('É preciso ler e aceitar o '+tituloTermo(evento).toLowerCase()+'.');}}
  if(c.cpf){const vistos={};pessoas.forEach((p,k)=>{if(p.cpf&&vistos[p.cpf]!==undefined){$('p'+p.el.dataset.p+'_cpf').classList.add('err');erros.push(`Pessoa ${k+1}: CPF repetido no grupo.`);}vistos[p.cpf]=k;});}
  if(erros.length){$('erro').innerHTML=`<div class="msg bad">${erros.map(esc).join('<br>')}</div>`;$('erro').scrollIntoView({behavior:'smooth',block:'center'});return;}
  $('erro').innerHTML='';$('btnEnviar').disabled=true;$('btnEnviar').textContent='Enviando…';

  const refs=pessoas.map(()=>db.collection('inscricoes').doc());
  const grupo=pessoas.length>1?{grupo:'G'+gerarCodigo(),grupoIds:refs.map(r=>r.id)}:{};
  const ok=[],falhas=[];let encerrado=false;
  for(let k=0;k<pessoas.length;k++){
    const p=pessoas[k],ref=refs[k];
    const dados={eventoId:evento.id,codigo:gerarCodigo(),nome:p.nome,cpf:p.cpf,telefone:p.telefone,email:p.email,extra:'',respostas:p.respostas,...grupo,...(criancasGratis(evento)?{crianca:p.crianca,nascimento:p.nasc,isento:p.crianca}:{}),...(p.meia?{meia:true,meiaMotivo:p.meiaMotivo.slice(0,80)}:{}),...(termoAtivo(evento)?{termoAceito:true,termoAceitoEm:firebase.firestore.FieldValue.serverTimestamp(),termoVersao:evento.termo.versao||1,termoAceitoPor:pessoas[0].nome}:{}),
      checkin:false,checkinEm:null,pago:false,pagoEm:null,criadoEm:firebase.firestore.FieldValue.serverTimestamp()};
    const bt=db.batch();bt.set(ref,dados);
    if(c.cpf&&p.cpf)bt.set(db.collection('bloqueios').doc(evento.id+'_'+p.cpf),{eventoId:evento.id,inscricaoId:ref.id});
    try{
      await bt.commit();ok.push({id:ref.id,...dados,pessoa:k});
      guardar({id:ref.id,eventoId:evento.id,titulo:evento.titulo,nome:p.nome,codigo:dados.codigo});
    }catch(e){
      let motivo='não foi possível concluir';
      if(e.code==='permission-denied'){
        if(!encerrado){try{encerrado=!(await db.collection('eventos').doc(evento.id).get()).data().aberto;}catch(x){}}
        motivo=encerrado?'as inscrições foram encerradas':c.cpf?'este CPF já está inscrito neste evento':'não foi possível concluir';
      }else if(e.code==='unavailable')motivo='sem conexão com a internet';
      falhas.push({nome:p.nome,motivo,pessoa:k});
    }
  }
  if(!ok.length){
    $('erro').innerHTML=`<div class="msg bad">${falhas.map(f=>esc((pessoas.length>1?f.nome+': ':'')+f.motivo.charAt(0).toUpperCase()+f.motivo.slice(1)+'.')).join('<br>')}${c.cpf?'<br>Se você perdeu o voucher, fale com a organização.':''}</div>`;
    $('btnEnviar').disabled=false;atualizarPessoas();return;
  }
  history.replaceState(null,'',ok.length>1?'?vs='+ok.map(i=>i.id).join(','):'?v='+ok[0].id);
  mostrarVouchers(ok,evento,{novo:true,falhas,grupoTodo:ok});
}

/* ================== Vouchers (um ou vários) ================== */
async function abrirVouchers(ids,unico){
  const docs=(await Promise.all(ids.map(id=>db.collection('inscricoes').doc(id).get().catch(()=>null)))).filter(d=>d&&d.exists);
  if(!docs.length){topo('Voucher','Voucher não encontrado');tela('<div class="card"><p class="muted center">Este voucher não existe ou a inscrição foi cancelada.</p></div>');return;}
  const lista=docs.map(d=>({id:d.id,...d.data()}));
  const e=await db.collection('eventos').doc(lista[0].eventoId).get();
  const ev=e.exists?{id:e.id,...e.data()}:{titulo:'Evento'};
  lista.forEach(i=>guardar({id:i.id,eventoId:i.eventoId,titulo:ev.titulo,nome:i.nome,codigo:i.codigo}));
  // Se o voucher faz parte de um grupo, carrega o grupo para calcular o Pix total
  let grupoTodo=lista;
  const gids=lista[0].grupoIds;
  if(Array.isArray(gids)&&gids.length>1){
    const faltam=gids.filter(id=>!lista.find(i=>i.id===id)).slice(0,MAX_GRUPO);
    const extras=(await Promise.all(faltam.map(id=>db.collection('inscricoes').doc(id).get().catch(()=>null)))).filter(d=>d&&d.exists).map(d=>({id:d.id,...d.data()}));
    grupoTodo=[...lista,...extras];
  }
  mostrarVouchers(lista,ev,{novo:false,falhas:[],grupoTodo,unico});
}

let atual=null;
function mostrarVouchers(lista,ev,o){
  atual={lista,ev,img:null,pix:''};
  if(ev.imagem){const im=new Image();im.src=ev.imagem;atual.img=im;}
  const px=cobra(ev),varios=lista.length>1;
  const pend=(o.grupoTodo||lista).filter(i=>!i.pago&&!i.isento);
  atual.pend=pend;
  topo(varios?'Vouchers de inscrição':'Voucher de inscrição',ev.titulo,metaEv(ev));
  const outrosDoGrupo=(o.grupoTodo||[]).length>lista.length;
  tela(`
    ${o.novo?`<div class="card"><div class="msg ok" style="margin-top:0">✅ ${varios?lista.length+' inscrições realizadas!':'Inscrição realizada!'}${px&&pend.length?' Falta só o pagamento via Pix (abaixo).':''}</div>
      ${o.falhas.length?`<div class="msg bad">Não foi possível inscrever:<br>${o.falhas.map(f=>'• '+esc(f.nome)+' — '+esc(f.motivo)).join('<br>')}</div>`:''}
      ${varios?`<div class="muted" style="margin-top:10px">Cada pessoa tem o seu voucher abaixo. Salve ou compartilhe todos.</div>
        <button class="btn pri" onclick="compartilharTodos()">📤 Compartilhar todos os vouchers</button>
        <button class="btn" onclick="copiarTexto(location.href,'Link dos vouchers copiado!')">🔗 Copiar link de todos</button>`:''}
    </div>`:''}
    ${varios&&!o.novo?`<div class="card"><button class="btn pri" style="margin-top:0" onclick="compartilharTodos()">📤 Compartilhar todos os vouchers</button></div>`:''}
    ${outrosDoGrupo?`<div class="card"><div class="muted">Este voucher faz parte de uma inscrição em grupo (${o.grupoTodo.length} pessoas).</div>
      <a class="btn" style="text-decoration:none" href="?vs=${esc(o.grupoTodo.map(i=>i.id).join(','))}">👥 Ver todos os vouchers do grupo</a></div>`:''}
    ${px&&pend.length?cartaoPix(ev,pend):''}
    ${lista.map((i,k)=>cartaoVoucher(i,ev,k,varios)).join('')}
    ${termoAtivo(ev)&&lista.some(i=>i.termoAceito)?`<div class="card"><details><summary><b>✔ ${esc(tituloTermo(ev))} aceito</b></summary><div class="termoTxt">${esc(textoTermo(ev))}</div></details></div>`:''}
    ${ev.descricao?`<div class="card"><p class="desc" style="margin:0">${esc(ev.descricao)}</p></div>`:''}`);
  lista.forEach((i,k)=>new QRCode($('qr'+k),{text:linkVoucher(i.id),width:varios?180:220,height:varios?180:220,correctLevel:QRCode.CorrectLevel.M}));
  if(px&&pend.length)new QRCode($('qrPix'),{text:atual.pix,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
}
function cartaoVoucher(i,ev,k,varios){
  const px=cobra(ev);
  return `<div class="card voucher">
    ${k===0||varios?banner(ev):''}
    ${i.checkin?'<div class="msg bad" style="margin-top:0">Este voucher já foi utilizado na entrada.</div>':''}
    ${i.isento?'<div style="margin-top:4px"><span class="st ok">🎈 Criança — inscrição gratuita</span></div>':px?`<div style="margin-top:4px"><span class="st ${i.pago?'ok':'pend'}">${i.pago?'✔ Pagamento confirmado':'⏳ Pagamento pendente'}</span>${i.meia?' <span class="st pend">🎟 Meia-entrada</span>':''}</div>`:''}
    <div class="muted" style="margin-top:12px">${varios?'Participante '+(k+1):'Participante'}</div>
    <div class="nome">${esc(i.nome)}</div>
    <div class="qrbox"><div id="qr${k}"></div></div>
    <div class="muted">Código</div><div class="codigo">${esc(i.codigo)}</div>
    <p class="muted">Apresente este QR code na entrada do evento.</p>
    <button class="btn ${varios?'':'pri'}" onclick="compartilhar(${k})">📤 Salvar / compartilhar ${varios?'este voucher':'voucher'}</button>
    <div class="row"><button class="btn" onclick="baixar(${k})">⬇ Baixar imagem</button><button class="btn" onclick="copiarLink(${k})">🔗 Copiar link</button></div>
  </div>`;
}
function cartaoPix(ev,pend){
  const tot=pend.reduce((s,i)=>s+valorDe(i,ev),0),p={...ev.pix,valor:Math.round(tot*100)/100};
  atual.pix=brcode(p,(pend.length>1?'GRP':'INSC')+pend[0].codigo);
  return `<div class="card pix center">
    <h3>Pagamento via Pix</h3>
    <div class="valor">${esc(moeda(p.valor))}</div>
    ${pend.length>1||pend.some(i=>i.meia)?`<div class="muted">${pend.map(i=>esc(i.nome.split(' ')[0])+' '+esc(moeda(valorDe(i,ev)))+(i.meia?' (meia)':'')).join(' · ')}</div>`:''}
    <div class="muted" style="margin-top:6px">Abra o app do seu banco, escolha <b>Pix → Ler QR code</b> ou <b>Pix copia e cola</b>.</div>
    <div class="qrbox"><div id="qrPix"></div></div>
    <textarea class="copia" id="pixCopia" readonly onclick="this.select()">${esc(atual.pix)}</textarea>
    <button class="btn pri" onclick="copiarTexto(atual.pix,'Código Pix copiado! Cole no app do banco.')">📋 Copiar Pix copia e cola</button>
    <div style="margin-top:14px">
      <div class="kvp"><span>Recebedor</span><b>${esc(ev.pix.nome)}</b></div>
      <div class="kvp"><span>Chave Pix</span><b>${esc(ev.pix.chave)}</b></div>
    </div>
    <button class="btn" onclick="copiarTexto(${esc(JSON.stringify(ev.pix.chave))},'Chave Pix copiada!')">Copiar só a chave</button>
    ${ev.pix.whats?`<button class="btn" onclick="enviarComprovante()">💬 Enviar comprovante pelo WhatsApp</button>`:''}
    <p class="muted" style="margin-bottom:0">Depois que a organização confirmar o pagamento, esta página mostra <b>Pagamento confirmado</b>.</p>
    <button class="btn" onclick="location.reload()">🔄 Atualizar situação</button>
  </div>`;
}
function copiarTexto(t,ok){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert(ok)).catch(()=>prompt('Copie:',t));}
function enviarComprovante(){
  const {ev,pend}=atual;let d=String(ev.pix.whats||'').replace(/\D/g,'');if(!(d.length>=12&&d.startsWith('55')))d='55'+d;
  const msg=`Olá! Segue o comprovante do Pix da${pend.length>1?'s':''} inscriç${pend.length>1?'ões':'ão'}.\nEvento: ${ev.titulo}\n`+
    pend.map(i=>`• ${i.nome} (código ${i.codigo})${i.meia?' — meia':''}`).join('\n')+`\nValor: ${moeda(pend.reduce((s,i)=>s+valorDe(i,ev),0))}`;
  window.open('https://wa.me/'+d+'?text='+encodeURIComponent(msg),'_blank');
}
function quebra(x,t,cx,y,maxW,lh,maxL){const ps=String(t).split(' ');let l='',n=1;for(const p of ps){const tt=l?l+' '+p:p;if(x.measureText(tt).width>maxW&&l){if(n>=maxL){x.fillText(l+'…',cx,y);return y;}x.fillText(l,cx,y);y+=lh;n++;l=p;}else l=tt;}x.fillText(l,cx,y);return y;}
function imagemVoucher(k){
  const i=atual.lista[k],ev=atual.ev;
  const tmp=document.createElement('div');new QRCode(tmp,{text:linkVoucher(i.id),width:520,height:520,correctLevel:QRCode.CorrectLevel.M});
  const q=tmp.querySelector('canvas');
  const W=800,H=1180,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#f4f5fb';x.fillRect(0,0,W,H);
  x.fillStyle='#4338ca';x.fillRect(0,0,W,250);
  const im=atual.img;
  if(im&&im.complete&&im.naturalWidth){
    const s=Math.max(W/im.naturalWidth,250/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;
    x.drawImage(im,(W-dw)/2,(250-dh)/2,dw,dh);
    x.fillStyle='rgba(20,22,60,.62)';x.fillRect(0,0,W,250);
  }
  x.fillStyle='#fff';x.textAlign='center';
  x.font='600 24px system-ui,sans-serif';x.fillText('VOUCHER DE INSCRIÇÃO',W/2,56);
  x.font='bold 40px system-ui,sans-serif';const y=quebra(x,ev.titulo,W/2,114,W-70,48,2);
  x.font='26px system-ui,sans-serif';x.fillText(metaEv(ev),W/2,y+48);
  x.fillStyle='#fff';x.beginPath();x.moveTo(60,290);x.arcTo(740,290,740,1120,24);x.arcTo(740,1120,60,1120,24);x.arcTo(60,1120,60,290,24);x.arcTo(60,290,740,290,24);x.fill();
  x.fillStyle='#6b6f85';x.font='24px system-ui,sans-serif';x.fillText('Participante',W/2,345);
  x.fillStyle='#1c1d29';x.font='bold 38px system-ui,sans-serif';quebra(x,i.nome,W/2,395,W-160,44,2);
  x.drawImage(q,140,450,520,520);
  x.fillStyle='#6b6f85';x.font='24px system-ui,sans-serif';x.fillText('Código',W/2,1015);
  x.fillStyle='#4338ca';x.font='bold 46px system-ui,sans-serif';x.fillText(i.codigo.split('').join(' '),W/2,1068);
  x.fillStyle='#6b6f85';x.font='22px system-ui,sans-serif';x.fillText('Apresente este QR code na entrada',W/2,1160);
  return c;
}
function nomeArq(k){const i=atual.lista[k];return 'voucher-'+i.codigo+'-'+i.nome.split(' ')[0].normalize('NFD').replace(/[^\w]/g,'').toLowerCase()+'.png';}
function baixar(k){const a=document.createElement('a');a.href=imagemVoucher(k).toDataURL('image/png');a.download=nomeArq(k);a.click();}
const blobDe=k=>new Promise(r=>imagemVoucher(k).toBlob(b=>r(new File([b],nomeArq(k),{type:'image/png'})),'image/png'));
async function compartilhar(k){
  const f=await blobDe(k);
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:'Voucher — '+atual.ev.titulo,text:'Voucher de '+atual.lista[k].nome+': '+linkVoucher(atual.lista[k].id)});}catch(e){}
  }else baixar(k);
}
async function compartilharTodos(){
  const fs=await Promise.all(atual.lista.map((_,k)=>blobDe(k)));
  if(navigator.canShare&&navigator.canShare({files:fs})){
    try{await navigator.share({files:fs,title:'Vouchers — '+atual.ev.titulo});}catch(e){}
  }else atual.lista.forEach((_,k)=>setTimeout(()=>baixar(k),k*400));
}
function copiarLink(k){copiarTexto(linkVoucher(atual.lista[k].id),'Link do voucher copiado!');}
</script>
