<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administrador · Inscrições</title>
<meta name="theme-color" content="#1e1b4b">
<link rel="manifest" id="manifestLink">
<link rel="icon" id="favIcon">
<link rel="apple-touch-icon" id="appleIcon">
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#1c1d29;--muted:#6b6f85;--line:#e3e5ee;--pri:#4338ca;--pri2:#eef0ff;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#12131a;--card:#1c1d27;--text:#eceef6;--muted:#9a9db3;--line:#2d2f3d;--pri:#818cf8;--pri2:#262a4a;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a;--warn:#fbbf24;--warnbg:#3a2e10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
header{position:sticky;top:0;z-index:5;background:#1e1b4b;color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.hrow h1{font-size:18px;margin:0;flex:1}
.hrow small{display:block;font-weight:400;opacity:.75;font-size:12px}
.iconbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:14px;text-decoration:none}
main{padding:16px;padding-bottom:60px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#12131a}}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.6}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card);color:var(--text);font-family:inherit}
h3{font-size:15px;margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--pri2);border-radius:10px;padding:3px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;color:var(--pri);font-size:14px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.org{cursor:pointer}
.org .top{display:flex;gap:10px;align-items:flex-start}
.org h2{font-size:17px;margin:0}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.neu{background:var(--pri2);color:var(--pri)}
.kv{font-size:15px;margin:4px 0}
.kv span{color:var(--muted)}
.linkbox{word-break:break-all;font-size:13px;background:var(--pri2);color:var(--pri);padding:9px;border-radius:10px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 8px;font-size:19px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c1d29;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%}
#toast.show{opacity:1}
.login{max-width:380px;margin:12vh auto 0;padding:16px}
.login h1{text-align:center;font-size:22px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.hidden{display:none!important}
.log{font-family:ui-monospace,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:200px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>

<div id="telaLogin" class="login hidden">
  <h1>Administrador · Inscrições</h1>
  <div class="card">
    <label>E-mail</label><input id="lgEmail" type="email" autocomplete="username">

<div id="telaApp" class="hidden">
  <header><div class="hrow">
    <h1>Administrador · Inscrições<small>Organizadores de eventos</small></h1>

  <main>
    <div class="kpis">

    <div class="row" style="margin-top:8px">

      <button data-f="todos" class="on">Todos</button><button data-f="ativos">Ativos</button><button data-f="vencidos">Vencidos</button><button data-f="suspensos">Suspensos</button>
    </div>
    <div id="lista"><div class="empty">Carregando…</div></div>
  </main>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)fechar()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script>
/* ================== Utilidades ================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2800);}
function abrir(html){$('sheet').innerHTML=html;$('modal').classList.add('show');}
function fechar(){$('modal').classList.remove('show');}
const brl=c=>(Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cents=s=>{s=String(s||'').replace(/[^\d,.]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:Math.round(n*100);};
const reais=c=>c?(c/100).toFixed(2).replace('.',','):'';
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function maisMeses(iso,n){const[a,m,d]=iso.split('-').map(Number);const x=new Date(a,m-1+n,1);const ult=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(d,ult));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
const diasAte=iso=>Math.round((new Date(iso+'T12:00:00')-new Date(hoje()+'T12:00:00'))/864e5);
const fmtDia=iso=>{if(!iso)return '—';const[a,m,d]=iso.split('-');return `${d}/${m}/${a}`;};
const slug=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30);
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
async function copiar(t){try{await navigator.clipboard.writeText(t);toast('Copiado');}catch(e){prompt('Copie:',t);}}
const erroMsg=e=>({'auth/invalid-credential':'E-mail ou senha incorretos','auth/wrong-password':'E-mail ou senha incorretos','auth/user-not-found':'E-mail ou senha incorretos',
  'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco','auth/invalid-email':'E-mail inválido','auth/weak-password':'Senha fraca (mínimo 6 caracteres)',
  'permission-denied':'Sem permissão (publique as regras novas do Firestore)'}[e.code]||('Erro: '+(e.code||e.message)));
const PLANOS={comissao:'Pix automático + comissão (%)',inscrito:'Chave Pix própria: por inscrito pago',evento:'Valor fixo por evento',proprio:'Próprio (sem cobrança)'};
// Modelos antigos: continuam funcionando para quem já usa, mas não aparecem para novos organizadores
const PLANOS_ANTIGOS={taxa:'Taxa paga pelo atleta (modelo antigo)',mensal:'Mensal (modelo antigo)'};
const nomePlano=p=>PLANOS[p]||PLANOS_ANTIGOS[p]||p||'';
const ROT_VALOR={inscrito:'Valor por inscrito pago (R$)',taxa:'Taxa por inscrição (R$)',evento:'Valor por evento (R$)',mensal:'Mensalidade (R$)'};
const pctTxt=o=>String(Number(o.comissaoMP||0)).replace('.',',')+'%';
const CONDICOES={'50-50':'50% na contratação + 50% até 5 dias após o evento',avista:'À vista na contratação',apos:'Tudo até 5 dias após o evento'};
const ADIC_PADRAO={checkin:{ativo:false,pessoas:3,turnos:1,valor:15000},conferencia:{ativo:false,valor:35000},outro:{ativo:false,desc:'',valor:0}};
function adic(o){const a=(o&&o.adicionais)||{};return{checkin:{...ADIC_PADRAO.checkin,...(a.checkin||{})},conferencia:{...ADIC_PADRAO.conferencia,...(a.conferencia||{})},outro:{...ADIC_PADRAO.outro,...(a.outro||{})}};}
function listaAdicionais(o){
  const a=adic(o),l=[];
  if(a.checkin.ativo)l.push({nome:`Check-in presencial: ${a.checkin.pessoas} pessoa(s) × ${a.checkin.turnos} turno(s) × ${brl(a.checkin.valor)}`,valor:a.checkin.pessoas*a.checkin.turnos*a.checkin.valor});
  if(a.conferencia.ativo)l.push({nome:'Conferência de pagamentos',valor:a.conferencia.valor});
  if(a.outro.ativo&&a.outro.valor)l.push({nome:a.outro.desc||'Outro',valor:a.outro.valor});
  return l;
}
const totalAdicionais=o=>listaAdicionais(o).reduce((s,x)=>s+x.valor,0);
// Valor base de UM evento com N inscritos pagos (centavos)
function baseEvento(o,pagos){
  if(o.plano==='comissao')return pagos*Math.round((o.precoRef||0)*Number(o.comissaoMP||0)/100);
  if(o.plano==='inscrito')return Math.max(pagos*(o.valor||0),o.minimo||0);
  if(o.plano==='taxa')return pagos*(o.valor||0);
  if(o.plano==='evento')return o.valor||0;
  return 0;
}
const porInscrito=o=>o.plano==='inscrito'||o.plano==='taxa'||o.plano==='comissao';
function resumoPlano(o){
  switch(o.plano){
    case 'comissao':return `${pctTxt(o)} de cada inscrição paga`+(o.pisoPct?` · garantia mínima de ${o.pisoPct}% dos pagantes previstos`:'');
    case 'inscrito':return `${brl(o.valor)} por inscrito pago`+(o.minimo?` · mínimo ${brl(o.minimo)} por evento`:'');
    case 'taxa':return `${brl(o.valor)} por inscrição, somado ao valor pago pelo atleta`;
    case 'evento':return `${brl(o.valor)} por evento`;
    case 'mensal':return `${brl(o.valor)}/mês · vence ${fmtDia(o.vencimento)}`;
    default:return 'Sem cobrança';
  }
}
const recebido=o=>(o.pagamentos||[]).reduce((s,p)=>s+(p.valor||0),0);

/* ---- PWA ---- */
(function(){
  const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');
  x.fillStyle='#1e1b4b';x.fillRect(0,0,192,192);x.fillStyle='#fff';if(x.roundRect){x.beginPath();x.roundRect(36,52,120,88,12);x.fill();}else x.fillRect(36,52,120,88);
  x.fillStyle='#1e1b4b';x.font='bold 64px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('⚙',96,98);
  const ic=c.toDataURL();$('favIcon').href=ic;$('appleIcon').href=ic;
  const base=location.href.split(/[?#]/)[0];
  const m={name:'Administrador · Inscrições',short_name:'Admin Inscrições',start_url:base,scope:base,display:'standalone',background_color:'#1e1b4b',theme_color:'#1e1b4b',icons:[{src:ic,sizes:'192x192',type:'image/png'}]};
  $('manifestLink').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
})();

/* ================== Firebase ================== */
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let fns=null;try{fns=firebase.app().functions('southamerica-east1');}catch(e){}
const TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const APP=new URL('../',location.href.split(/[?#]/)[0]).href;       // app de controle
const links=id=>({controle:APP,suporte:APP+'?org='+encodeURIComponent(id)});
// Registra no histórico do organizador as ações feitas no painel
function registrarAdm(id,acao,texto){
  db.collection('organizadores').doc(id).collection('historico').add({em:TS(),email:SUPER,nome:'Administrador',papel:'admin',acao,texto:String(texto).slice(0,300),disp:'Painel admin'}).catch(()=>{});
}

async function entrar(){
  $('lgErro').textContent='';const b=$('lgBtn');b.disabled=true;
  try{await auth.signInWithEmailAndPassword($('lgEmail').value.trim().toLowerCase(),$('lgSenha').value);$('lgSenha').value='';}
  catch(e){$('lgErro').textContent=erroMsg(e);}
  b.disabled=false;
}
let unsub=null;
auth.onAuthStateChanged(u=>{
  if(unsub){unsub();unsub=null;}
  if(!u){$('telaApp').classList.add('hidden');$('telaLogin').classList.remove('hidden');return;}
  if((u.email||'').toLowerCase()!==SUPER){alert('Este painel é só do administrador geral.');auth.signOut();return;}
  $('telaLogin').classList.add('hidden');$('telaApp').classList.remove('hidden');
  unsub=db.collection('organizadores').onSnapshot(s=>{S.orgs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));render();enviarKpis();},
    e=>{$('lista').innerHTML=`<div class="card" style="color:var(--bad)">${esc(erroMsg(e))}</div>`;});
});

/* ================== Lista ================== */
const S={orgs:[],filtro:'todos'};
document.querySelectorAll('#filtro button').forEach(b=>b.onclick=()=>{S.filtro=b.dataset.f;document.querySelectorAll('#filtro button').forEach(x=>x.classList.toggle('on',x===b));render();});
const vencido=o=>o.status==='ativo'&&o.plano==='mensal'&&o.vencimento&&diasAte(o.vencimento)<0;
function situacao(o){
  if(o.status!=='ativo')return '<span class="tag bad">Suspenso</span>';
  if(o.plano==='proprio')return '<span class="tag neu">Próprio</span>';
  if(o.plano==='mensal'&&o.vencimento){const d=diasAte(o.vencimento);
    if(d<0)return `<span class="tag bad">Vencido há ${-d} dia${d===-1?'':'s'}</span>`;
    if(d<=5)return `<span class="tag warn">Vence em ${d} dia${d===1?'':'s'}</span>`;}
  return '<span class="tag ok">Ativo</span>';
}
function render(){
  const ativos=S.orgs.filter(o=>o.status==='ativo');
  $('kAtivos').textContent=ativos.length;$('kVencidos').textContent=S.orgs.filter(vencido).length;
  $('kSuspensos').textContent=S.orgs.length-ativos.length;
  $('kReceita').textContent=brl(S.orgs.reduce((s,o)=>s+saldo(o),0)).replace(',00','');
  $('btnMeu').classList.toggle('hidden',S.orgs.some(o=>o.donoEmail===SUPER));
  const q=$('busca').value.trim().toLowerCase();
  const l=S.orgs.filter(o=>(S.filtro==='todos'||(S.filtro==='ativos'&&o.status==='ativo')||(S.filtro==='vencidos'&&vencido(o))||(S.filtro==='suspensos'&&o.status!=='ativo'))
    &&(!q||[o.nome,o.id,o.donoEmail,o.donoNome].join(' ').toLowerCase().includes(q)));
  $('lista').innerHTML=!l.length?`<div class="empty">${S.orgs.length?'Nenhum organizador neste filtro.':'Nenhum organizador ainda.<br>Toque em <b>+ Novo organizador</b>.'}</div>`:
    l.map(o=>`<div class="card org" onclick="detalhe('${esc(o.id)}')"><div class="top"><div style="flex:1;min-width:0"><h2>${esc(o.nome)}</h2>
      <div class="muted small">${esc(o.id)} · ${esc(o.donoNome||'')} · ${esc(o.donoEmail||'')}</div>
      ${o.plano==='proprio'?'':`<div class="small" style="margin-top:4px">${esc(nomePlano(o.plano))} · ${esc(resumoPlano(o))}${saldo(o)>0?` · <b style="color:var(--bad)">a receber ${brl(saldo(o))}</b>`:''}</div>`}</div>
      ${situacao(o)}</div></div>`).join('');
}

/* ================== Criar login sem sair do painel ================== */
async function criarLogin(email,senha){
  const app2=firebase.apps.find(a=>a.name==='cadastro')||firebase.initializeApp(firebaseConfig,'cadastro');
  const a2=app2.auth();await a2.setPersistence(firebase.auth.Auth.Persistence.NONE);
  try{await a2.createUserWithEmailAndPassword(email,senha);await a2.signOut();return true;}
  catch(e){if(e.code==='auth/email-already-in-use')return false;throw e;}
}

/* ================== Novo organizador ================== */
function camposCobranca(o){
  o=o||{plano:'comissao',valor:300,minimo:5000,condicao:'apos',pisoPct:80,vencimento:maisMeses(hoje(),1)};
  const A=adic(o),opc={...PLANOS,...(PLANOS_ANTIGOS[o.plano]?{[o.plano]:PLANOS_ANTIGOS[o.plano]}:{})};
  return `<h3>Cobrança combinada</h3>
    <label>Modelo</label><select id="fPlano" onchange="planoUI()">
      ${Object.entries(opc).map(([k,v])=>`<option value="${k}" ${o.plano===k?'selected':''}>${v}</option>`).join('')}</select>
    <div id="fCobr">
      <div class="muted small hidden" id="fComInfo" style="margin-top:6px">A comissão é a porcentagem do <b>Pix automático</b> acima: cai sozinha na sua conta a cada Pix. O que for pago por fora é cobrado no <b>fechamento do evento</b>.</div>
      <div class="row">
        <div id="fValBox"><label id="fValorLbl">Valor (R$)</label><input id="fValor" inputmode="decimal" placeholder="3,00" value="${reais(o.valor)}" oninput="estimar()"></div>
        <div id="fMinBox"><label>Mínimo por evento (R$)</label><input id="fMin" inputmode="decimal" placeholder="50,00" value="${reais(o.minimo)}" oninput="estimar()"></div>
        <div id="fVencBox"><label>Vencimento</label><input id="fVenc" type="date" value="${esc(o.vencimento||'')}"></div>
      </div>
      <div id="fEvBox">
        <label>Referente a <span class="muted">(evento combinado)</span></label><input id="fRef" placeholder="Ex.: Formatura 3º ano 2026" value="${esc(o.referente||'')}">
        <div class="row">
          <div><label>Pagantes previstos</label><input id="fPrev" inputmode="numeric" placeholder="200" value="${o.previstos||''}" oninput="estimar()"></div>

function lerCobranca(){
  const plano=$('fPlano').value,n=id=>Math.max(0,parseInt($(id).value,10)||0);
  const d={plano,valor:plano==='proprio'||plano==='comissao'?0:cents($('fValor').value),obs:$('fObs').value.trim(),
    minimo:plano==='inscrito'?cents($('fMin').value):0,vencimento:plano==='mensal'?($('fVenc').value||null):null};
  if(plano!=='mensal'&&plano!=='proprio'){
    Object.assign(d,{referente:$('fRef').value.trim(),previstos:n('fPrev'),condicao:$('fCond').value,
      pisoPct:Math.min(100,n('fPiso')),precoRef:plano==='comissao'?cents($('fPreco').value):0,
      adicionais:{checkin:{ativo:$('aCk').checked,pessoas:n('aCkP'),turnos:n('aCkT'),valor:cents($('aCkV').value)},
        conferencia:{ativo:$('aCf').checked,valor:cents($('aCfV').value)},
        outro:{ativo:$('aOu').checked,desc:$('aOuD').value.trim(),valor:cents($('aOuV').value)}}});
  }else Object.assign(d,{adicionais:null,condicao:null});
  return d;
}
/* ---- Pix automático (Mercado Pago) com comissão da plataforma ---- */
function camposMP(o={}){
  const on=!!o.mpLiberado,pct=o.comissaoMP!=null?o.comissaoMP:5;
  return `<h3>Pix automático (Mercado Pago)</h3>
    <label style="display:flex;gap:10px;align-items:flex-start;color:var(--text);margin-top:10px"><input type="checkbox" id="fMp" style="width:20px;height:20px;flex:0 0 auto;margin-top:2px" ${on?'checked':''} onchange="$('fMpBox').classList.toggle('hidden',!this.checked);estimar()"> <span>Liberar o <b>Pix automático</b> para este organizador<br><span class="muted small">Ele conecta a conta Mercado Pago dele; o Pix cai direto na conta dele e a sua comissão cai na sua conta, automaticamente.</span></span></label>
    <div id="fMpBox" class="${on?'':'hidden'}">
      <label>Comissão da plataforma (% de cada pagamento)</label><input id="fMpPct" inputmode="decimal" value="${String(pct).replace('.',',')}" oninput="estimar()">
      <div class="muted small" style="margin-top:4px">Ex.: 5% de uma inscrição de R$ 60,00 = R$ 3,00 para você. A taxa do Mercado Pago (cerca de 0,99% no Pix) é descontada do organizador.</div>
    </div>`;
}
function lerMP(){const pct=Math.max(0,Math.min(50,parseFloat(String($('fMpPct').value).replace(',','.'))||0));return{mpLiberado:$('fMp').checked,comissaoMP:Math.round(pct*100)/100};}
function estimar(){
  const el=$('fEst');if(!el)return;
  const o={...lerCobranca(),...lerMP()};
  if(o.plano==='mensal'||o.plano==='proprio'){el.innerHTML='';return;}
  const prev=o.previstos||0,base=baseEvento(o,prev),ad=listaAdicionais(o),tot=base+ad.reduce((s,x)=>s+x.valor,0);
  const unit=o.plano==='comissao'?Math.round((o.precoRef||0)*Number(o.comissaoMP||0)/100):0;
  el.innerHTML=`<b>Estimativa${porInscrito(o)?` para ${prev} pagante(s)`:''}</b>
    <div class="small" style="margin-top:6px">${esc(nomePlano(o.plano))}: ${brl(base)}${o.plano==='comissao'?` (${pctTxt(o)} de ${brl(o.precoRef)} = ${brl(unit)} por inscrição${o.precoRef?'':' — informe o valor da inscrição'})`:''}${o.plano==='inscrito'&&o.minimo&&prev*o.valor<o.minimo?' (valor mínimo)':''}</div>
    ${porInscrito(o)&&o.pisoPct&&prev?`<div class="small">Garantia mínima: ${Math.ceil(prev*o.pisoPct/100)} pagantes (${o.pisoPct}% de ${prev})</div>`:''}
    ${ad.map(x=>`<div class="small">${esc(x.nome)}: ${brl(x.valor)}</div>`).join('')}
    <div style="margin-top:6px;font-size:18px"><b>Total: ${brl(tot)}</b></div>
    ${o.plano==='comissao'&&base?`<div class="small">A comissão do Pix automático cai sozinha na sua conta; no fechamento você cobra só o que foi pago por fora.</div>`:''}
    ${o.condicao==='50-50'?`<div class="small">Entrada (50%): ${brl(Math.round(tot/2))}</div>`:''}`;
}

async function criarOrg(){
  const nome=$('fNome').value.trim(),id=$('fId').value.trim(),donoNome=$('fDono').value.trim(),email=$('fEmail').value.trim().toLowerCase(),senha=$('fSenha').value.trim();
  if(!nome||!donoNome)return toast('Preencha o nome do organizador e do responsável');
  if(!/^[a-z0-9][a-z0-9-]{2,29}$/.test(id))return toast('Identificador: 3 a 30 caracteres, só a-z, 0-9 e hífen');
  if(!emailOk(email))return toast('E-mail inválido');
  if(email===SUPER)return toast('Use o e-mail do responsável, não o seu (para você, use "Meu organizador")');
  if(senha.length<6)return toast('Senha com pelo menos 6 caracteres');
  const bt=$('fOk');bt.disabled=true;bt.textContent='Criando…';
  const volta=m=>{bt.disabled=false;bt.textContent='Criar organizador e login';toast(m);};
  try{
    if((await db.collection('organizadores').doc(id).get()).exists)return volta('Já existe um organizador com esse identificador');
    const u=await db.collection('usuarios').doc(email).get();
    if(u.exists)return volta(`Este e-mail já está no organizador “${u.data().orgId}”`);
    const nova=await criarLogin(email,senha);
    const b=db.batch();
    b.set(db.collection('organizadores').doc(id),{nome,donoNome,donoEmail:email,status:'ativo',podeCriarEventos:$('fPodeCriar').checked,...lerCobranca(),...lerMP(),criadoEm:TS()});
    b.set(db.collection('usuarios').doc(email),{orgId:id,papel:'dono'});
    await b.commit();
    fechar();toast('Organizador criado!');
    boasVindas({id,nome,donoNome,donoEmail:email},nova?senha:null);
  }catch(e){console.error(e);volta(erroMsg(e));}
}

// Separa as inscrições em: pagas pelo Pix automático, pagas por fora, entraram sem pagar, cortesias.
const FX={};   // dados carregados do evento aberto
function valorIns(i,ev){if(!(ev.pix&&ev.pix.ativo)||i.isento)return 0;return Math.round(Number(i.meia&&ev.pix.meia?ev.pix.valorMeia:ev.pix.valor||0)*100);}

    const fe=o.fechamentos||{};
    $('fxLista').innerHTML=evs.length?evs.map(e=>`<div class="card org" style="margin-bottom:8px" onclick="fecharEvento('${esc(id)}','${esc(e.id)}')">

      ${fe[e.id]?`<span class="tag ${fe[e.id].aCobrar>0?'warn':'ok'}">${fe[e.id].aCobrar>0?'a cobrar '+brl(fe[e.id].aCobrar):'fechado'}</span>`:'<span class="tag neu">abrir</span>'}</div></div>`).join(''):'<div class="empty">Nenhum evento.</div>';
  }catch(e){$('fxLista').innerHTML=`<div class="card" style="color:var(--bad)">${esc(erroMsg(e))}</div>`;}
}
async function fecharEvento(id,evId){
  abrir(`<h2>🧾 Fechamento</h2><div class="empty">Lendo inscrições e pagamentos…</div>`);
  try{
    const r=db.collection('organizadores').doc(id);
    const [evS,ins,cob,cfg]=await Promise.all([r.collection('eventos').doc(evId).get(),r.collection('inscricoes').where('eventoId','==',evId).get(),
      r.collection('cobrancas').where('eventoId','==',evId).where('status','==','approved').get().catch(()=>({docs:[]})),
      db.collection('config').doc('cobranca').get().catch(()=>null)]);
    if(!evS.exists)return toast('Evento não encontrado');
    Object.assign(FX,{id,evId,ev:{id:evId,...evS.data()},ins:ins.docs.map(d=>({id:d.id,...d.data()})),cobs:cob.docs.map(d=>d.data()),pix:cfg&&cfg.exists?(cfg.data().pix||''):''});FX.pix0=FX.pix;
    const o=S.orgs.find(x=>x.id===id),f=(o.fechamentos||{})[evId]||{},jaAdic=listaFech(o).some(x=>x.adic&&x.id!==evId);
    FX.p={cortesias:f.cortesias||0,previstos:f.previstos!=null?f.previstos:(o.previstos||0),pisoPct:f.pisoPct!=null?f.pisoPct:(o.pisoPct!=null?o.pisoPct:80),adic:f.adic!=null?f.adic:(!jaAdic&&totalAdicionais(o)>0)};
    renderFechamento();
  }catch(e){console.error(e);abrir(`<h2>🧾 Fechamento</h2><div class="card" style="color:var(--bad)">${esc(erroMsg(e))}</div><button class="btn full" onclick="detalhe('${esc(id)}')">Voltar</button>`);}
}
function calcFechamento(o,ev,ins,cobs,p){
  const pct=Number(o.comissaoMP||0),porPessoa=o.plano==='inscrito'||o.plano==='taxa',fixo=o.plano==='evento';
  const unit=i=>porPessoa?(o.valor||0):Math.round(valorIns(i,ev)*pct/100);
  const unitCheio=porPessoa?(o.valor||0):Math.round(Math.round(Number((ev.pix&&ev.pix.valor)||0)*100)*pct/100);
  const pagante=i=>!i.isento&&valorIns(i,ev)>0;
  const plat=ins.filter(i=>i.pago&&i.pagoPor==='mercadopago');
  const fora=ins.filter(i=>i.pago&&i.pagoPor!=='mercadopago'&&pagante(i));
  const semPag=ins.filter(i=>!i.pago&&i.checkin&&pagante(i)).sort((a,b)=>unit(b)-unit(a));
  const cort=Math.min(p.cortesias||0,semPag.length),semCob=semPag.slice(cort);
  const isentos=ins.filter(i=>i.isento),faltou=ins.filter(i=>!i.pago&&!i.checkin&&pagante(i));
  const recebidoAuto=Math.round(cobs.reduce((s,c)=>s+Number(c.taxaRecebida||c.taxa||0),0)*100);
  const soma=l=>l.reduce((s,i)=>s+unit(i),0);
  const vPlat=porPessoa?plat.length*(o.valor||0):(cobs.length?recebidoAuto:soma(plat));
  const vFora=soma(fora),vSem=soma(semCob);
  const pagantes=plat.length+fora.length+semCob.length;
  const pisoQtd=p.previstos&&p.pisoPct?Math.ceil(p.previstos*p.pisoPct/100):0;
  const faltam=Math.max(0,pisoQtd-pagantes),vPiso=faltam*unitCheio;
  let total=fixo?(o.valor||0):vPlat+vFora+vSem+vPiso,vMin=0;
  if(o.plano==='inscrito'&&o.minimo&&total<o.minimo){vMin=o.minimo-total;total=o.minimo;}
  const vAdic=p.adic?totalAdicionais(o):0;total+=vAdic;
  const aCobrar=Math.max(0,total-(fixo?0:Math.min(recebidoAuto,total)));
  return {pct,porPessoa,fixo,unitCheio,plat,fora,semPag,cort,semCob,isentos,faltou,recebidoAuto,vPlat,vFora,vSem,pagantes,pisoQtd,faltam,vPiso,vMin,vAdic,total,aCobrar};
}
function renderFechamento(){
  const o=S.orgs.find(x=>x.id===FX.id),ev=FX.ev,p=FX.p,c=calcFechamento(o,ev,FX.ins,FX.cobs,p);FX.c=c;
  const taxaTxt=c.porPessoa?brl(o.valor||0)+' por pessoa':pctTxt(o)+' do valor';
  const nomes=(l,f)=>l.length?`<details style="margin:2px 0 4px 10px"><summary class="small">ver nomes</summary><div class="small muted">${l.map(i=>esc(i.nome)+(f?' — '+esc(f(i)):'')).join('<br>')}</div></details>`:'';
  const linha=(ico,txt,v,extra)=>`<div class="kv" style="display:flex;gap:8px"><span style="flex:1;color:var(--text)">${ico} ${txt}</span><b>${v}</b></div>${extra||''}`;
  const sp=c.semPag.length;
  $('sheet').innerHTML=`<h2>🧾 ${esc(ev.titulo||'Evento')}</h2>
    <div class="muted small">${ev.data?fmtDia(ev.data)+' · ':''}${ev.pix&&ev.pix.ativo?(ev.pix.modo==='mp'?'Pix automático':'Pix com chave própria')+' · inscrição '+brl(Math.round(Number(ev.pix.valor||0)*100)):'evento gratuito'} · taxa: ${c.fixo?'valor fixo '+brl(o.valor):taxaTxt}</div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><b>${c.plat.length}</b><span>Pix automático</span></div>
      <div class="kpi"><b>${c.fora.length}</b><span>Pagos por fora</span></div>
      <div class="kpi"><b>${sp}</b><span>Entraram sem pagar</span></div>
      <div class="kpi"><b>${c.faltou.length}</b><span>Não pagaram nem vieram</span></div>
    </div>
    ${c.fixo?`<div class="card">Modelo de <b>valor fixo por evento</b>: ${brl(o.valor)}.</div>`:`<div class="card">
      ${linha('✅',`${c.plat.length} pago(s) pelo Pix automático`,brl(c.vPlat),`<div class="muted small" style="margin:-2px 0 6px 24px">${c.porPessoa?'':'comissão que já caiu sozinha na sua conta'}</div>`)}
      ${linha('💵',`${c.fora.length} pago(s) por fora (Pix direto/dinheiro)`,brl(c.vFora),nomes(c.fora,i=>'confirmado por '+(i.pagoPorNome||i.pagoPor||'?')))}
      ${linha('🚪',`${sp} entraram sem pagamento${c.cort?` − ${c.cort} cortesia(s)`:''}`,brl(c.vSem),nomes(c.semPag,i=>'liberado por '+(i.checkinPorNome||i.checkinPor||'?')))}
      ${c.pisoQtd?linha('📏',`Garantia mínima: ${c.pisoQtd} pagantes (${p.pisoPct}% de ${p.previstos}) · houve ${c.pagantes}`,c.faltam?'+ '+brl(c.vPiso):'atingida',c.faltam?`<div class="muted small" style="margin:-2px 0 6px 24px">faltaram ${c.faltam} × ${brl(c.unitCheio)}</div>`:''):''}
      ${c.vMin?linha('📌','Complemento até o mínimo por evento','+ '+brl(c.vMin)):''}
      ${c.vAdic?linha('➕','Adicionais combinados','+ '+brl(c.vAdic)):''}
      ${c.isentos.length?`<div class="muted small">${c.isentos.length} isento(s) (crianças/cortesia do sistema) não entram na conta.</div>`:''}
    </div>`}
    <div class="row">
      <div><label>Cortesias</label><input id="xCort" inputmode="numeric" value="${p.cortesias}" oninput="fxSet()"></div>
      <div><label>Previstos</label><input id="xPrev" inputmode="numeric" value="${p.previstos||''}" placeholder="0" oninput="fxSet()"></div>

    </div>
    ${totalAdicionais(o)?`<label style="display:flex;gap:8px;align-items:center;color:var(--text);margin-top:10px"><input type="checkbox" id="xAdic" style="width:20px;height:20px" ${p.adic?'checked':''} onchange="fxSet()"> Incluir os adicionais combinados (${brl(totalAdicionais(o))})</label>`:''}
    <div class="card" style="margin-top:12px;background:var(--pri2);border-color:transparent">
      <div class="small">Total da taxa do evento: ${brl(c.total)}${c.recebidoAuto&&!c.fixo?` · já recebido automático: ${brl(Math.min(c.recebidoAuto,c.total))}`:''}</div>
      <div style="font-size:20px;margin-top:4px"><b>A cobrar do organizador: ${brl(c.aCobrar)}</b></div>

      ${c.aCobrar?`<button class="btn ok" onclick="receberFechamento()">✓ Registrar recebimento</button>`:''}</div>
    <div style="height:8px"></div><button class="btn full" onclick="abrirFechamento('${esc(FX.id)}')">Voltar</button>`;
}
function fxSet(){
  const n=id=>Math.max(0,parseInt(($(id)||{}).value,10)||0);
  Object.assign(FX.p,{cortesias:n('xCort'),previstos:n('xPrev'),pisoPct:Math.min(100,n('xPiso')),adic:!!($('xAdic')&&$('xAdic').checked)});
  const foco=document.activeElement&&document.activeElement.id,pos=foco&&$(foco).selectionStart,pix=$('xPix').value;
  FX.pix=pix;renderFechamento();
  if(foco&&$(foco)){$(foco).focus();try{$(foco).setSelectionRange(pos,pos);}catch(e){}}
}

  const o=S.orgs.find(x=>x.id===FX.id),c=FX.c,p=FX.p,ev=FX.ev,pix=$('xPix').value.trim();

function pagar(id,valorSug,obsSug){
  const o=S.orgs.find(x=>x.id===id),rec=recebido(o);
  let sug=o.valor||0;
  if(o.plano!=='mensal'){
    const dev=devido(o),total=dev||(baseEvento(o,o.previstos||0)+totalAdicionais(o));
    sug=Math.max(0,total-rec);if(o.condicao==='50-50'&&!rec&&!dev)sug=Math.round(total/2);
  }
  if(valorSug!=null)sug=valorSug;
  abrir(`<h2>Registrar ${o.plano==='mensal'?'pagamento':'recebimento'}</h2>
    <div class="muted">${esc(o.nome)} — ${esc(resumoPlano(o))}</div>
    <div class="row"><div><label>Valor recebido (R$)</label><input id="pValor" inputmode="decimal" value="${reais(sug)}"></div>
      <div><label>Data</label><input id="pData" type="date" value="${hoje()}"></div></div>
    <label>Observação</label><input id="pObs" value="${esc(obsSug||'')}" placeholder="${o.condicao==='50-50'&&!rec?'Entrada 50%':'Ex.: saldo final'}">
    ${o.plano==='mensal'?`<div class="muted small" style="margin-top:6px">O vencimento avança 1 mês.</div>`:''}
    <div style="height:14px"></div>
    <div class="row"><button class="btn" onclick="detalhe('${esc(id)}')">Voltar</button><button class="btn ok" onclick="salvarPagamento('${esc(id)}')">Registrar</button></div>`);
}
async function salvarPagamento(id){
  const o=S.orgs.find(x=>x.id===id),valor=cents($('pValor').value),data=$('pData').value||hoje(),obs=$('pObs').value.trim();
  if(!(valor>0))return toast('Informe o valor');
  const up={ultimoPagamento:data,pagamentos:firebase.firestore.FieldValue.arrayUnion({data,valor,obs,em:Date.now()})};
  if(o.plano==='mensal'){const base=o.vencimento&&diasAte(o.vencimento)>-60?o.vencimento:hoje();up.vencimento=maisMeses(base,1);}
  if(o.status!=='ativo'&&!confirm('Reativar o acesso deste organizador também?'))delete up.status;else if(o.status!=='ativo')up.status='ativo';
  try{await db.collection('organizadores').doc(id).update(up);registrarAdm(id,'cobranca',`Registrou recebimento de ${brl(valor)}${obs?' ('+obs+')':''}`);toast('Recebimento registrado');detalhe(id);}catch(e){toast(erroMsg(e));}
}
function textoResumo(o){
  const ad=listaAdicionais(o),rec=recebido(o),dev=devido(o),fs=listaFech(o);
  let t=`Olá, ${o.donoNome}! Segue o resumo do acordo do sistema de inscrições (${o.nome}):\n\n`;
  if(o.referente)t+=`📅 Referente a: ${o.referente}\n`;
  t+=`💳 Taxa de serviço: ${resumoPlano(o)}\n`;
  if(o.plano==='comissao')t+=`   (a taxa das inscrições pagas pelo Pix automático é descontada na hora; as pagas por fora entram no fechamento do evento)\n`;
  if(o.plano==='taxa')t+=`   (a taxa entra no valor da inscrição; o repasse é feito pelo relatório de inscritos pagos)\n`;
  if(ad.length)t+=`➕ Adicionais:\n`+ad.map(x=>`   • ${x.nome}: ${brl(x.valor)}`).join('\n')+'\n';
  if(o.plano!=='mensal'&&o.previstos&&!fs.length)t+=`📊 Estimativa para ${o.previstos} pagantes: ${brl(baseEvento(o,o.previstos)+totalAdicionais(o))}\n`;
  if(fs.length)t+=`🧾 Fechamentos:\n`+fs.map(f=>`   • ${f.titulo}: ${brl(f.aCobrar)}`).join('\n')+'\n';
  if(o.condicao)t+=`🗓 Pagamento: ${CONDICOES[o.condicao]}\n`;
  if(rec)t+=`✅ Já recebido: ${brl(rec)}\n`;
  if(o.plano!=='mensal'&&dev-rec>0)t+=`💰 Saldo: ${brl(dev-rec)}\n`;
  t+=`\nIncluso: configuração do evento, página de inscrição com Pix, vouchers com QR Code, equipe de check-in e planilha de inscritos.`;
  return t;
}

    <div class="muted small" style="margin-top:6px">Login do responsável: ${esc(o.donoEmail)} (para trocar, crie um novo organizador ou fale comigo no suporte).</div>
    <h3>Permissões</h3>
    <label style="display:flex;gap:10px;align-items:flex-start;color:var(--text);margin-top:10px"><input type="checkbox" id="fPodeCriar" style="width:20px;height:20px;flex:0 0 auto;margin-top:2px" ${o.podeCriarEventos!==false?'checked':''}> <span>O organizador pode <b>criar e excluir</b> eventos<br><span class="muted small">Desmarcado: você cria o evento (em "Entrar como suporte") e ele só edita e configura.</span></span></label>
    ${camposMP(o)}
    ${camposCobranca(o)}
    <div style="height:14px"></div>
    <div class="row"><button class="btn" onclick="detalhe('${esc(id)}')">Voltar</button><button class="btn pri" onclick="salvarEdicao('${esc(id)}')">Salvar</button></div>`);
  planoUI();
}
async function salvarEdicao(id){
  const o0=S.orgs.find(x=>x.id===id)||{};
  const nome=$('fNome').value.trim(),donoNome=$('fDono').value.trim();
  if(!nome)return toast('Informe o nome');
  try{const c=lerCobranca(),pc=$('fPodeCriar').checked,m=lerMP();await db.collection('organizadores').doc(id).update({nome,donoNome,podeCriarEventos:pc,...c,...m});
    if(m.mpLiberado!==!!o0.mpLiberado||m.comissaoMP!==o0.comissaoMP)registrarAdm(id,'config',m.mpLiberado?`Pix automático (Mercado Pago) liberado — comissão ${String(m.comissaoMP).replace('.',',')}%`:'Pix automático (Mercado Pago) desativado');if(pc!==(o0.podeCriarEventos!==false))registrarAdm(id,'config',pc?'Organizador liberado para criar e excluir eventos':'Criação e exclusão de eventos reservadas ao administrador');registrarAdm(id,'cobranca',`Cobrança atualizada: ${nomePlano(c.plano)} — ${resumoPlano({...c,...m})}`);toast('Salvo');detalhe(id);}catch(e){toast(erroMsg(e));}
}
async function apagarColecao(ref,log){
  let total=0;
  for(;;){
    const s=await ref.limit(400).get();if(s.empty)break;
    const b=db.batch();s.docs.forEach(d=>b.delete(d.ref));await b.commit();total+=s.size;if(log)log(total);
  }
  return total;
}
async function excluir(id){
  const o=S.orgs.find(x=>x.id===id);
  const conf=prompt(`Isto apaga ${o.nome} com TODOS os eventos, inscrições e equipe. Não tem volta.\n\nDigite o identificador (${id}) para confirmar:`);
  if(conf!==id)return conf===null?null:toast('Identificador não confere');
  abrir(`<h2>Excluindo ${esc(o.nome)}…</h2><div class="log" id="xLog">Iniciando…</div>`);
  const log=t=>{$('xLog').textContent+='\n'+t;};
  try{
    const r=db.collection('organizadores').doc(id);
    const eq=await r.collection('equipe').get();
    const b=db.batch();eq.docs.forEach(d=>b.delete(db.collection('usuarios').doc(d.id)));
    if(o.donoEmail)b.delete(db.collection('usuarios').doc(o.donoEmail));
    await b.commit();log('Logins desvinculados: '+(eq.size+1));
    for(const n of ['inscricoes','bloqueios','eventos','equipe','historico','publico']){const t=await apagarColecao(r.collection(n));log(n+': '+t+' apagado(s)');}
    await r.delete();log('Organizador excluído.');
    log('\nObs.: as contas de login continuam existindo no Firebase (Authentication), mas sem acesso a nada.');
    $('sheet').insertAdjacentHTML('beforeend','<div style="height:10px"></div><button class="btn full" onclick="fechar()">Fechar</button>');
  }catch(e){log('ERRO: '+erroMsg(e));$('sheet').insertAdjacentHTML('beforeend','<div style="height:10px"></div><button class="btn full" onclick="fechar()">Fechar</button>');}
}

</script>
